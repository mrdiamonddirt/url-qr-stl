<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>URL 2 STL — Turn any URL into a 3D-printable QR code</title>

    <meta name="description" content="Turn any URL into a 3D-printable QR code. Create branded QR layouts, short links, and export STL or OBJ files — all in one workspace." />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mrdiamonddirt.github.io/url-qr-stl/" />
    <meta property="og:title" content="URL 2 STL — Turn any URL into a 3D-printable QR code" />
    <meta property="og:description" content="Turn any URL into a 3D-printable QR code. Create branded QR layouts, short links, and export STL or OBJ files — all in one workspace." />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="URL 2 STL — Turn any URL into a 3D-printable QR code" />
    <meta name="twitter:description" content="Turn any URL into a 3D-printable QR code. Create branded QR layouts, short links, and export STL or OBJ files — all in one workspace." />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="canonical" href="https://mrdiamonddirt.github.io/url-qr-stl/" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="URL 2 STL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <!-- Restore path saved by 404.html for GitHub Pages SPA routing -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          // BASE is /url-qr-stl in production, empty in dev
          var base = '/url-qr-stl';
          window.history.replaceState(null, '', base + redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
