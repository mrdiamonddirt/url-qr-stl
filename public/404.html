<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // SPA redirect trick for static hosting.
    // When the host 404s on a deep path (e.g. /s/CODE),
    // store the requested URL so index.html can restore it after loading the app shell.
    (function () {
      var path = window.location.pathname || '/';
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      sessionStorage.setItem('spa_redirect', path + search + hash);
      window.location.replace('/');
    })();
  </script>
</head>
<body></body>
</html>
