<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>URL 2 STL | Turn Any URL Into a 3D-Printable QR Code</title>

    <meta name="description" content="Build 3D-printable QR tags from any URL. Create short links, customize QR templates, and export STL or OBJ files from one editor." />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://url2stl.com/" />
    <meta property="og:title" content="URL 2 STL | Turn Any URL Into a 3D-Printable QR Code" />
    <meta property="og:description" content="Build 3D-printable QR tags from any URL. Create short links, customize QR templates, and export STL or OBJ files from one editor." />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="URL 2 STL | Turn Any URL Into a 3D-Printable QR Code" />
    <meta name="twitter:description" content="Build 3D-printable QR tags from any URL. Create short links, customize QR templates, and export STL or OBJ files from one editor." />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="canonical" href="https://url2stl.com/" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="URL 2 STL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <!-- Restore path saved by 404.html for static-hosted SPA deep links -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          // BASE is root for production and development.
          var base = '';
          window.history.replaceState(null, '', base + redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
