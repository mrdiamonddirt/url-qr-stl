name: Deploy Dev to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GAM_SCAN_LIMIT_AD_UNIT_PATH: ${{ secrets.VITE_GAM_SCAN_LIMIT_AD_UNIT_PATH }}
          VITE_GAM_SCAN_LIMIT_SIZES: ${{ secrets.VITE_GAM_SCAN_LIMIT_SIZES }}
          VITE_REQUIRE_AUTH: "true"
        run: npm run build

      - name: Set dev CNAME
        run: echo "dev.url2stl.com" > dist/CNAME

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Inject build meta (timestamp & SHA)
        run: |
          npm install --no-save
          node scripts/inject-build-meta.cjs
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Deploy to url-qr-stl-dev gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEV_DEPLOY_PAT }}
          external_repository: mrdiamonddirt/url-qr-stl-dev
          publish_branch: gh-pages
          publish_dir: ./dist
